name: Build Desktop App

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: LanCaster-windows
          - os: ubuntu-latest
            artifact: LanCaster-linux
          - os: macos-latest
            artifact: LanCaster-macos

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev \
            gir1.2-webkit2-4.1 || true

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis -y

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -e ".[desktop]"
          pip install --no-cache-dir pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller lancaster.spec

      - name: Build Windows installer (NSIS)
        if: runner.os == 'Windows'
        run: |
          $env:PATH += ";C:\Program Files (x86)\NSIS"
          makensis installer\lancaster.nsi
        shell: pwsh

      - name: Upload portable artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/LanCaster/
          retention-days: 30

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: LanCaster-Setup
          path: dist/LanCaster-Setup.exe
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts/

      - name: Package archives with version
        run: |
          cd artifacts
          VERSION="${{ steps.version.outputs.VERSION }}"
          for dir in */; do
            name="${dir%/}"
            [ "$name" = "LanCaster-Setup" ] && continue
            if [ "$name" = "LanCaster-windows" ]; then
              (cd "$dir" && zip -r "../${name}-${VERSION}.zip" .)
            else
              tar -czf "${name}-${VERSION}.tar.gz" -C "$dir" .
            fi
          done
          if [ -f "LanCaster-Setup/LanCaster-Setup.exe" ]; then
            cp "LanCaster-Setup/LanCaster-Setup.exe" "LanCaster-Setup-${VERSION}.exe"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/LanCaster-windows-${{ steps.version.outputs.VERSION }}.zip
            artifacts/LanCaster-linux-${{ steps.version.outputs.VERSION }}.tar.gz
            artifacts/LanCaster-macos-${{ steps.version.outputs.VERSION }}.tar.gz
            artifacts/LanCaster-Setup-${{ steps.version.outputs.VERSION }}.exe
          generate_release_notes: true
