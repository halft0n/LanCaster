name: Build Desktop App

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: LanCaster-windows
          - os: ubuntu-latest
            artifact: LanCaster-linux
          - os: macos-latest
            artifact: LanCaster-macos

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev \
            gir1.2-webkit2-4.1 || true

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis -y

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -e ".[desktop]"
          pip install --no-cache-dir pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller lancaster.spec

      - name: Build Windows installer (NSIS)
        if: runner.os == 'Windows'
        run: |
          $env:PATH += ";C:\Program Files (x86)\NSIS"
          makensis installer\lancaster.nsi
        shell: pwsh

      - name: Upload portable artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/LanCaster/
          retention-days: 30

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: LanCaster-Setup
          path: dist/LanCaster-Setup.exe
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts/

      - name: Package archives
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            [ "$name" = "LanCaster-Setup" ] && continue
            tar -czf "${name}.tar.gz" -C "$dir" .
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/LanCaster-Setup/LanCaster-Setup.exe
          generate_release_notes: true
